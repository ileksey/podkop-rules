name: Compile SRS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'

      - name: Install Sing-box
        run: go install -v github.com/sagernet/sing-box/cmd/sing-box@latest

      - name: Convert TXT to JSON and compile SRS
        run: |
          jq -R '.' podkop_domains.txt | jq -s '{version: 1, rules: [{domain_suffix: .}]}' > rules.json
          $(go env GOPATH)/bin/sing-box rule-set compile rules.json -o rules.srs

      - name: Create Release and Upload SRS
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: rules.srs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
